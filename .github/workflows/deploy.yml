name: Deploy FastAPI AI Platform

on:
push:
branches:
- main

env:
ACR_NAME: acrai2026grant
IMAGE_NAME: ai-platform-api
RESOURCE_GROUP: rg-ai-platform-lab
CONTAINER_APP: cae-ai-platform-api

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Azure Login
    uses: azure/login@v2
    with:
      client-id: ${{ secrets.AZURE_CLIENT_ID }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

  - name: Azure CLI Version
    run: az version

  - name: Login to Azure Container Registry
    run: |
      docker login $ACR_NAME.azurecr.io \
      -u ${{ secrets.ACR_USERNAME }} \
      -p ${{ secrets.ACR_PASSWORD }}

  - name: Build Docker Image
    run: |
      docker build \
      -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} .

  - name: Push Docker Image
    run: |
      docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

  - name: Deploy New Revision
    run: |
      az extension add --name containerapp --upgrade

      az containerapp update \
        --name $CONTAINER_APP \
        --resource-group $RESOURCE_GROUP \
        --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}
```
